<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Error</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:Inter,sans-serif;background:#F2F5F9;color:#0F1F2E;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:16px;box-sizing:border-box}
.card{background:#fff;border:1px solid #E2EAF1;border-radius:20px;padding:48px 44px;max-width:560px;width:100%;box-sizing:border-box;text-align:center;box-shadow:0 18px 50px -18px rgba(0,68,115,.35)}
.code{display:inline-block;background:#FDECEC;color:#B91C1C;font-weight:800;border-radius:100px;padding:6px 16px;font-size:13px;letter-spacing:.08em}
h1{font-size:clamp(22px,6vw,32px);margin:14px 0 8px;letter-spacing:-.03em}
p{color:#5B6B7C}a{display:inline-block;margin-top:18px;background:#0067AC;color:#fff!important;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:10px}
a:hover{background:#00568F}
@media(max-width:480px){.card{padding:32px 22px;border-radius:16px}}
</style></head><body><div class="card"><span class="code">OOPS · SOMETHING WENT WRONG</span><h1>There was an error displaying your request</h1><p>Sorry for the inconvenience. Please try again or contact DSTI.</p><a href="./">Back to status page</a></div></body></html>

<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>404 Not Found</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:Inter,sans-serif;background:#F2F5F9;color:#0F1F2E;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.card{background:#fff;border:1px solid #E2EAF1;border-radius:20px;padding:48px 44px;max-width:560px;text-align:center;box-shadow:0 18px 50px -18px rgba(0,68,115,.35)}
.code{display:inline-block;background:#EDF4F9;color:#0067AC;font-weight:800;border-radius:100px;padding:6px 16px;font-size:13px;letter-spacing:.08em}
h1{font-size:34px;margin:14px 0 8px;letter-spacing:-.03em}
p{color:#5B6B7C}a{display:inline-block;margin-top:18px;background:#0067AC;color:#fff!important;text-decoration:none;font-weight:700;padding:11px 22px;border-radius:10px}
a:hover{background:#00568F}
</style></head><body><div class="card"><span class="code">404 · NOT FOUND</span><h1>Page not found</h1><p>The page you requested is unavailable or you entered the wrong URL.</p><a href="./">Back to status page</a></div></body></html>
